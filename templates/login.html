{% extends "base.html" %}
{% block title %}Login - Student Records{% endblock %}
{% block topbar_title %}Login{% endblock %}

{% block content %}
<div class="form-wrap single auth-wrap login-background">
    <div class="form-card auth-card">
        <header class="auth-heading">
            <div class="school-mark" aria-hidden="true">SR</div>
            <div>
                <p class="eyebrow">SCHOOL RECORDS SYSTEM</p>
                <h1 class="auth-title">Account Login</h1>
                <p class="muted">Sign in using your username or email address.</p>
            </div>
        </header>
        <div class="auth-rule"></div>

        <form method="POST">
            <label>Username or Email Address</label>
            <input type="text" name="username" required>

            <label>Password</label>
            <input type="password" name="password" required>

            <button class="btn primary full" type="submit">Sign In</button>
        </form>

        <p class="form-footer">Don't have an account? <a href="{{ url_for('signup') }}">Register here</a></p>
    </div>
</div>
{% endblock %}
